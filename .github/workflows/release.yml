name: Build and publish Clasp Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clasp-studio-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set monotonically increasing update build
        env:
          UPDATE_BUILD: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          with open('Info.plist', 'rb') as f:
              info = plistlib.load(f)
          info['CFBundleVersion'] = str(1000 + int(os.environ['UPDATE_BUILD']))
          with open('Info.plist', 'wb') as f:
              plistlib.dump(info, f)
          PY
      - name: Build native universal app
        run: ./build.sh --universal
      - name: Verify app behavior and encoder
        run: |
          test_status=0
          '../Clasp Studio.app/Contents/MacOS/ClaspStudio' --self-test --test-output "$RUNNER_TEMP/encoder-check.mov" > verification.log 2>&1 || test_status=$?
          cat verification.log
          exit "$test_status"
      - name: Package the installer
        run: |
          python3 -m pip install --target .packaging-python -r Packaging/requirements.txt
          PACKAGING_PYTHONPATH="$PWD/.packaging-python" ./package-dmg.sh
      - name: Sign update manifest
        env:
          CLASP_UPDATE_SIGNING_KEY: ${{ secrets.CLASP_UPDATE_SIGNING_KEY }}
        run: |
          mkdir -p release
          cp '../Clasp Studio Preview App.zip' release/Clasp-Studio.zip
          cp '../Clasp Studio.dmg' release/Clasp-Studio.dmg
          xcrun swiftc -O Packaging/UpdateReleaseSigner.swift -o "$RUNNER_TEMP/sign-update" -framework CryptoKit
          "$RUNNER_TEMP/sign-update" sign release/Clasp-Studio.zip '../Clasp Studio.app/Contents/Info.plist' release
      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ github.run_number }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('release/update-manifest.json') as f:
              m = json.load(f)
          with open('release/release-notes.md', 'w') as f:
              f.write(f"Clasp Studio {m['version']} · build {m['build']}\n\n")
              f.write("Universal macOS app for Apple silicon and Intel. This build is ad-hoc signed and not notarized.\n\n")
              f.write("Install with the DMG, or let an installed Clasp Studio app receive the signed update. Recording and saving finish before an update is installed.\n\n")
              f.write(f"Source commit: {os.environ['RELEASE_SHA']}\n")
          PY
          gh release create "build-${RELEASE_RUN}" release/Clasp-Studio.zip release/Clasp-Studio.dmg release/update-manifest.json release/update-manifest.sig --repo "$REPOSITORY" --target "$RELEASE_SHA" --title "Clasp Studio · build $((1000 + RELEASE_RUN))" --notes-file release/release-notes.md --latest
